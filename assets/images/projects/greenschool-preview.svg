<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#solarBg)"/>

  <!-- Technical Header -->
  <rect x="20" y="16" width="560" height="28" rx="4" fill="#0f1f38" stroke="#1e3a66" stroke-width="1"/>
  <circle cx="36" cy="30" r="4" fill="#f59e0b"/>
  <text x="48" y="34" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">MICROGRID &amp; EMBEDDED IOT // PLTS SOLAR HARVESTING + ARDUINO BARRIER GATE</text>

  <!-- Solar PV Panel -->
  <polygon points="50,140 160,80 250,110 140,170" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <!-- PV Cells grid -->
  <line x1="85" y1="120" x2="195" y2="95" stroke="#0369a1" stroke-width="1.5"/>
  <line x1="120" y1="105" x2="230" y2="80" stroke="#0369a1" stroke-width="1.5"/>
  <line x1="90" y1="150" x2="180" y2="100" stroke="#0369a1" stroke-width="1.5"/>
  <text x="60" y="195" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">SOLAR PV ARRAY</text>
  <text x="60" y="210" fill="#94a3b8" font-family="monospace" font-size="8.5">Off-Grid Power Source</text>

  <!-- Charge Controller / Battery -->
  <rect x="180" y="210" width="70" height="45" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="230" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">SOLAR MPPT</text>
  <text x="190" y="244" fill="#94a3b8" font-family="monospace" font-size="8">&amp; LIPO 12V</text>
  <line x1="140" y1="170" x2="180" y2="225" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Microcontroller Arduino -->
  <rect x="300" y="120" width="90" height="110" rx="6" fill="#00878F" stroke="#f8fafc" stroke-width="2"/>
  <text x="310" y="145" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Arduino</text>
  <text x="310" y="160" fill="#e2e8f0" font-family="monospace" font-size="8.5">ATmega328P</text>
  <!-- USB Port -->
  <rect x="294" y="180" width="12" height="20" fill="#94a3b8"/>
  <line x1="250" y1="230" x2="300" y2="200" stroke="#10b981" stroke-width="2"/>

  <!-- Smart Parking Gate -->
  <rect x="470" y="160" width="24" height="80" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <!-- Barrier Arm -->
  <line x1="482" y1="175" x2="410" y2="120" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <line x1="482" y1="175" x2="420" y2="127" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,6"/>
  <text x="440" y="105" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">GATE OPEN</text>

  <!-- Ultrasonic Sensor Ultrasonic Waves -->
  <circle cx="430" cy="220" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="430" cy="220" r="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="410" y="250" fill="#38bdf8" font-family="monospace" font-size="8.5">HC-SR04 SENSOR</text>

  <!-- Footer Telemetry -->
  <rect x="20" y="295" width="560" height="32" rx="4" fill="#08172b" stroke="#1e3a66" stroke-width="1"/>
  <text x="32" y="315" fill="#10b981" font-family="monospace" font-size="9.5">ZERO EMISSION PROTOTYPE</text>
  <text x="240" y="315" fill="#38bdf8" font-family="monospace" font-size="9.5">AUTONOMOUS PARKING SENSING: ACTIVE</text>
  <text x="480" y="315" fill="#f59e0b" font-family="monospace" font-size="9.5">PENS PROJECT</text>
</svg>
