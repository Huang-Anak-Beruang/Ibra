<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b1d"/>
      <stop offset="100%" stop-color="#02170f"/>
    </linearGradient>
    <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e402c" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#pcbGreen)"/>
  <rect width="600" height="340" fill="url(#pcbGrid)"/>

  <!-- Technical Header -->
  <rect x="20" y="16" width="560" height="28" rx="4" fill="#083322" stroke="#12593b" stroke-width="1"/>
  <circle cx="36" cy="30" r="4" fill="#10b981"/>
  <text x="48" y="34" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">KiCAD PCB LAYOUT // 2-LAYER SWITCHED-MODE DC-DC BUCK/BOOST CONVERTER</text>
  <text x="500" y="34" fill="#10b981" font-family="monospace" font-size="10">● DRC PASSED</text>

  <!-- Copper Ground Plane Trace -->
  <path d="M 60 70 L 220 70 L 220 180 L 140 180 L 140 260 L 60 260 Z" fill="#0a402a" stroke="#d97706" stroke-width="2"/>
  <text x="70" y="90" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">VIN_HIGH_POWER_ZONE</text>

  <!-- Power Inductor (Toroidal / SMD Inductor) -->
  <rect x="180" y="120" width="70" height="70" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2.5"/>
  <circle cx="215" cy="155" r="22" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
  <text x="195" y="159" fill="#eab308" font-family="monospace" font-size="11" font-weight="bold">47 uH</text>
  <text x="190" y="180" fill="#94a3b8" font-family="monospace" font-size="8">L1 (POWER)</text>

  <!-- Switching MOSFET / PWM Controller IC -->
  <rect x="290" y="125" width="55" height="60" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <!-- IC Pins -->
  <rect x="282" y="132" width="8" height="5" fill="#e2e8f0"/>
  <rect x="282" y="145" width="8" height="5" fill="#e2e8f0"/>
  <rect x="282" y="158" width="8" height="5" fill="#e2e8f0"/>
  <rect x="282" y="171" width="8" height="5" fill="#e2e8f0"/>
  <rect x="345" y="132" width="8" height="5" fill="#e2e8f0"/>
  <rect x="345" y="145" width="8" height="5" fill="#e2e8f0"/>
  <rect x="345" y="158" width="8" height="5" fill="#e2e8f0"/>
  <rect x="345" y="171" width="8" height="5" fill="#e2e8f0"/>
  <text x="295" y="158" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">LM2596</text>

  <!-- High-Current Copper Traces -->
  <line x1="250" y1="155" x2="282" y2="155" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="353" y1="155" x2="400" y2="155" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Output Schottky Diode -->
  <rect x="310" y="215" width="45" height="25" rx="3" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="315" y="232" fill="#eab308" font-family="monospace" font-size="8.5">SS34</text>
  <line x1="332" y1="185" x2="332" y2="215" stroke="#f59e0b" stroke-width="4"/>

  <!-- Output Smoothing Capacitors (Low ESR) -->
  <circle cx="430" cy="140" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="430" y1="124" x2="430" y2="156" stroke="#38bdf8" stroke-width="2"/>
  <line x1="414" y1="140" x2="446" y2="140" stroke="#38bdf8" stroke-width="2"/>
  <text x="415" y="170" fill="#94a3b8" font-family="monospace" font-size="8.5">C_OUT: 220uF</text>

  <circle cx="480" cy="140" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="470" y="170" fill="#94a3b8" font-family="monospace" font-size="8.5">100nF</text>

  <!-- Terminal Blocks -->
  <rect x="60" y="190" width="30" height="40" fill="#166534" stroke="#d97706" stroke-width="1.5"/>
  <text x="65" y="215" fill="#f8fafc" font-family="monospace" font-size="8">V_IN</text>

  <rect x="520" y="190" width="30" height="40" fill="#166534" stroke="#d97706" stroke-width="1.5"/>
  <text x="525" y="215" fill="#f8fafc" font-family="monospace" font-size="8">V_OUT</text>

  <!-- Vias (Through-hole points) -->
  <circle cx="215" cy="95" r="4" fill="#d97706" stroke="#000" stroke-width="1"/>
  <circle cx="230" cy="95" r="4" fill="#d97706" stroke="#000" stroke-width="1"/>
  <circle cx="400" cy="220" r="4" fill="#d97706" stroke="#000" stroke-width="1"/>
  <circle cx="415" cy="220" r="4" fill="#d97706" stroke="#000" stroke-width="1"/>

  <!-- Footer Telemetry -->
  <rect x="20" y="295" width="560" height="32" rx="4" fill="#061e14" stroke="#12593b" stroke-width="1"/>
  <text x="32" y="315" fill="#6ee7b7" font-family="monospace" font-size="9.5">TOPOLOGY: BUCK / BOOST / BUCK-BOOST CONVERTER</text>
  <text x="370" y="315" fill="#f59e0b" font-family="monospace" font-size="9.5">TRACE WIDTH: 2.5 mm (3A RATED)</text>
</svg>
