<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="55%" stop-color="#0b2447"/>
      <stop offset="100%" stop-color="#041226"/>
    </linearGradient>
    <pattern id="oceanGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#132f54" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#oceanBg)"/>
  <rect width="600" height="340" fill="url(#oceanGrid)"/>

  <!-- Technical Header -->
  <rect x="20" y="16" width="560" height="28" rx="4" fill="#0c1b33" stroke="#1e3a66" stroke-width="1"/>
  <circle cx="36" cy="30" r="4" fill="#38bdf8"/>
  <text x="48" y="34" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">OFFSHORE ENERGY TRANSITION RESEARCH // WIND-TO-PLATFORM POWER INTEGRATION</text>

  <!-- Sea Level Line -->
  <line x1="20" y1="210" x2="580" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="30" y="225" fill="#64748b" font-family="monospace" font-size="9">MEAN SEA LEVEL (LAT)</text>

  <!-- Offshore Wind Turbine -->
  <!-- Tower -->
  <polygon points="120,90 128,90 134,250 114,250" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Jacket Foundation underwater -->
  <line x1="114" y1="250" x2="90" y2="300" stroke="#f59e0b" stroke-width="2"/>
  <line x1="134" y1="250" x2="158" y2="300" stroke="#f59e0b" stroke-width="2"/>
  <line x1="90" y1="280" x2="158" y2="280" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="318" fill="#f59e0b" font-family="monospace" font-size="9">SUBSEA PILE</text>

  <!-- Nacelle & Hub -->
  <rect x="110" y="80" width="28" height="14" rx="3" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="112" cy="87" r="7" fill="#38bdf8"/>

  <!-- Blades -->
  <line x1="112" y1="87" x2="112" y2="25" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="87" x2="55" y2="120" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="87" x2="165" y2="120" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="70" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">6.5 MW WTG</text>

  <!-- Power Cable (Subsea HVAC Cable) -->
  <path d="M 124 250 Q 240 285 360 250" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="180" y="278" fill="#10b981" font-family="monospace" font-size="9.5">33 kV SUBSEA POWER CABLE</text>

  <!-- Offshore Oil & Gas Production Platform -->
  <!-- Platform Deck -->
  <rect x="360" y="140" width="160" height="30" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <!-- Crane & Flare Stack -->
  <line x1="500" y1="140" x2="530" y2="70" stroke="#f59e0b" stroke-width="2"/>
  <line x1="510" y1="140" x2="530" y2="70" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="532" cy="65" r="4" fill="#ef4444"/>
  <text x="500" y="60" fill="#ef4444" font-family="monospace" font-size="8.5">FLARE</text>
  
  <!-- Platform Legs (Jacket) -->
  <line x1="380" y1="170" x2="360" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <line x1="500" y1="170" x2="520" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <line x1="370" y1="230" x2="510" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="160" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">OFFSHORE PLATFORM</text>
  <text x="375" y="195" fill="#f59e0b" font-family="monospace" font-size="9">GAS TURBINE GENERATOR HYBRID</text>

  <!-- Telemetry Badge Bottom -->
  <rect x="20" y="295" width="560" height="32" rx="4" fill="#08172b" stroke="#1e3a66" stroke-width="1"/>
  <text x="32" y="315" fill="#10b981" font-family="monospace" font-size="9.5">CO2 REDUCTION POTENTIAL: ~35%</text>
  <text x="240" y="315" fill="#38bdf8" font-family="monospace" font-size="9.5">GRID INTEGRATION: ISOLATED MICROGRID</text>
  <text x="470" y="315" fill="#94a3b8" font-family="monospace" font-size="9">RESEARCH PAPER</text>
</svg>
